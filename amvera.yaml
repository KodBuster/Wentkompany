# Конфигурация Amvera Cloud
# Обход сбоев Harbor (INTERNAL_ERROR при pull node:*-alpine в Docker-сборке):
# собираем и запускаем через окружение Node, без Dockerfile.
# https://docs.amvera.ru/applications/environments/nodejs-server.html
#
# В панели Amvera: окружение node.js / npm, ветка main.
# Секреты (Telegram, CRM) — Переменные. Публичные NEXT_PUBLIC_* — в amvera.build.env.

meta:
  environment: node
  toolchain:
    name: npm
    version: "22"

build:
  # Next подхватывает .env.production.local на этапе build
  additionalCommands: cp amvera.build.env .env.production.local && npm run build

run:
  command: npm run start
  containerPort: 3000
