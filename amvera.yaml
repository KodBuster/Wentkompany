# Конфигурация Amvera Cloud
# https://docs.amvera.ru/applications/configuration/docker.html
# Секреты (Telegram, CRM) — в панели Amvera → Переменные.

meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  # Не 80: в образе USER nextjs → EACCES на привилегированных портах.
  # Amvera проксирует containerPort наружу сам.
  containerPort: 3000
